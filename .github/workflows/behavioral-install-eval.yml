name: behavioral-install-eval

# Weekly behavioral eval of the install surface (MYC-419).
#
# The static text-presence guard (test_install_consent_contract.sh, in the
# per-PR ci gate) asserts the README CONTAINS the consent contract. This
# workflow asserts it WORKS: across install conversations, a fresh model
# handed README.md must show the install screen first, relay it and ask its
# one question, install on "yes" without asking again, install nothing and
# offer nothing else on "no", and hand Claude Code's permission prompts back
# to the user, even when the user gives permission to answer them. Two
# frozen control READMEs (the old consent contract, and the June menu README)
# must FAIL the same bar, proving the harness detects the failure classes.
#
# Scheduled weekly + manual dispatch, NOT per-PR: it spends real Anthropic
# API calls and measures doc behavior, not diffs (eval-gates-in-ci pattern:
# periodic tier). Up to 72 subject and 72 judge calls per run (a control
# stops at its first failing turn, usually the first).
#
# The eval script exits 2 (loud INFRA error) when ANTHROPIC_API_KEY is
# missing or empty, and for any exception that is not a verdict, so a dead
# repo secret or an SDK change can never read as a behavioral failure (exit 1)
# or as a green skip.
#
# The anthropic package is pinned to an exact version: an SDK release must
# not change the script's API calls between two weekly runs. Bump the pin on
# purpose, with a local run of the script.
#
# No untrusted user input is referenced in any run: command (schedule +
# manual dispatch only; inputs are repo-tracked files).

on:
  schedule:
    - cron: '0 14 * * 1'   # Mondays 14:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  eval:
    name: fresh model vs README (install behavior)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: install anthropic sdk
        run: python3 -m pip install anthropic==1.8.0
      - name: run behavioral install eval
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 tests/eval/behavioral_install_eval.py
