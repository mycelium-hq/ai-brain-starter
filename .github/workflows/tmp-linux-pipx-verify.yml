# TEMPORARY, not for merge (tickets#6171). Deleted before the PR opens.
name: tmp linux pipx verify
on:
  push:
    branches: ['claude/linux-pipx-6171']
permissions:
  contents: read
jobs:
  pipx-section:
    name: ${{ matrix.code }} / ${{ matrix.image }} / ${{ matrix.who }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        code: ['fixed']
        image: ['ubuntu:24.04', 'ubuntu:22.04', 'debian:12']
        who: ['student', 'root']
        include:
          - { code: 'before', image: 'ubuntu:24.04', who: 'student' }
    container: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: desktop-like base (python3 without pip or venv, no pipx)
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq python3 curl ca-certificates sudo >/dev/null
          python3 --version
          python3 -m pip --version || echo "no pip, as on a stock desktop"
          python3 -m venv /tmp/probe-venv >/dev/null 2>&1 && echo "venv works" || echo "venv does not work, as on a stock desktop"
          useradd -m -s /bin/bash student
          chmod -R a+rX "$GITHUB_WORKSPACE"
      - name: run the real pipx section, then use pipx
        run: bash .github/tmp-linux-pipx/harness.sh "${{ matrix.code }}" "${{ matrix.who }}"

  full-install:
    name: full bootstrap.sh / ubuntu:24.04 / student (informational)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    container: ubuntu:24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: desktop-like base plus git and curl
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq python3 git curl ca-certificates sudo xz-utils >/dev/null
          useradd -m -s /bin/bash student
          mkdir -p /home/student/.claude/skills
          cp -R "$GITHUB_WORKSPACE" /home/student/.claude/skills/ai-brain-starter
          rm -rf /home/student/.claude/skills/ai-brain-starter/.git /home/student/.claude/skills/ai-brain-starter/.github/tmp-linux-pipx
          chown -R student:student /home/student
      - name: Claude Code, which a real student already has
        run: su - student -c 'curl -fsSL https://claude.ai/install.sh | bash' 2>&1 | tail -5
      - name: README install as a user without password-free sudo
        run: |
          set +e
          su - student -c 'cd ~ && ABS_CONSENTED=1 timeout 1800 bash ~/.claude/skills/ai-brain-starter/bootstrap.sh' > /tmp/full.log 2>&1
          echo "bootstrap exit=$?"
          tail -150 /tmp/full.log
      - name: what landed
        if: always()
        run: |
          su - student -c 'export PATH="$HOME/.local/bin:$HOME/.local/node/bin:$PATH"; for c in pipx graphify fastmcp skill-seekers claude node gh obsidian python3; do printf "%-14s %s\n" "$c" "$(command -v $c || echo MISSING)"; done; echo "--- gaps"; cat ~/.claude/.ai-brain-starter-install-gaps.jsonl 2>/dev/null || echo none'
          echo "--- red lines"
          grep -nE '✗|FAILED|Traceback' /tmp/full.log | head -80 || true
